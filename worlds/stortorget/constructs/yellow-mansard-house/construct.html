<script>
/* Construct viewer — a dependency-free WebGL2 renderer for compiled construct
 * geometry (format "construct-geometry" version 2).
 *
 * Everything is a pure function of the geometry, the seed and a time t, so any frame
 * can be reproduced exactly (?t=3.2) for review captures. The renderer only draws what
 * the compiler produced: it runs no scene-supplied code and fetches nothing.
 *
 * URL parameters: t (freeze time, seconds), view (hero|front|side|back|top|three-quarter|<scene view>),
 * motion (full|reduced), mode (light|provenance), ui (1|0), labels (1|0), caption (1|0),
 * rounds (1|0: show or never show the round timeline a `construct rounds` run recorded),
 * sheet (assembly|views|motion|life|provenance|all), fps (15|20|30|60|0), capture (1),
 * open (0..1: hold the articulations at this opening instead of playing them),
 * shift (x,y: move the framed object across the screen, in fractions of the half-viewport),
 * zoom (>1 pulls the camera back to leave room around the object).
 */
(function () {
  "use strict";

  // ------------------------------------------------------------------------- palettes
  const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  // tones: accent, bright, hairline, structure, dust, identity(base), data, faint; then base and haze tints
  const PALETTES = {
    violet: { tones: ["#d16bd0", "#f6eaff", "#eadcf3", "#b7a4c8", "#9682d7", "#eadcf3", "#8fd3ff", "#6f6080"], base: "#070207", haze: "#d16bd0", haze2: "#9682d7" },
    cyan:   { tones: ["#44d6ff", "#e9fbff", "#d6f1f9", "#9dbcca", "#6c9cff", "#d6f1f9", "#9cffe0", "#4f6873"], base: "#01060a", haze: "#2fb6e0", haze2: "#6c7cff" },
    amber:  { tones: ["#ffb14a", "#fff4e0", "#f5e2c6", "#c8ae8d", "#ff8a5c", "#f5e2c6", "#ffd56b", "#6f5e49"], base: "#090502", haze: "#ff9a3a", haze2: "#ff6a4a" },
    green:  { tones: ["#57ff9a", "#ecfff4", "#d5f5e2", "#9cc4ad", "#62d4ff", "#d5f5e2", "#c6ff6b", "#4a6b58"], base: "#010804", haze: "#36d47e", haze2: "#3aa8d8" },
    ice:    { tones: ["#9fd8ff", "#f2faff", "#e0eef7", "#a9bfcf", "#b7a6ff", "#e0eef7", "#7ff0ff", "#56687a"], base: "#02050a", haze: "#7fb8e8", haze2: "#a090ff" },
    rose:   { tones: ["#ff6f9b", "#fff0f5", "#f6dce6", "#c9a6b6", "#ff9d6f", "#f6dce6", "#ffd1e3", "#735362"], base: "#0a0206", haze: "#ff4f86", haze2: "#ff8a5c" },
  };
  // identity light: a low-chroma tint over the structure tone (the place's own material)
  const IDENTITY = { "warm-wood": [0.88, 0.6, 0.34], stone: [0.8, 0.77, 0.7], steel: [0.62, 0.75, 0.88],
    brass: [0.96, 0.78, 0.4], bio: [0.45, 0.96, 0.72], ember: [1.0, 0.48, 0.26], ice: [0.7, 0.92, 1.0], paper: [0.96, 0.92, 0.82] };
  const CERT_CODE = { verified: 0, user_supplied: 1, inferred: 2, decorative: 3, traced: 4, size_verified: 5, shape_verified: 6,
    "inferred-1": 7, "inferred-2": 8, "inferred-3": 9, "inferred-4": 10, "traced-1": 11, "traced-2": 12 };
  // the provenance view's colours, by CERT_CODE: verified stays white; a part verified on one axis only has its own colour
  const CERT_RGB = [[0.85, 0.97, 1.0], [0.45, 1.0, 0.62], [1.0, 0.72, 0.3], [0.95, 0.42, 0.95], [0.44, 0.62, 1.0],
    [0.25, 0.88, 1.0], [0.77, 0.55, 1.0],
    // shades: deeper the more firmly a guess is held to the real thing (geometry part.evidence)
    [0.42, 0.39, 0.34], [0.63, 0.53, 0.35], [0.89, 0.71, 0.42], [1.0, 0.52, 0.0], [0.62, 0.71, 1.0], [0.24, 0.42, 1.0]];
  const SHADES = { inferred: ["DESIGNED", "DESCRIBED", "SEEN", "SEEN AND CHECKED"], traced: ["NOT YET CHECKED", "CHECKED"] };
  // what the provenance view shows for a part: one word, or which axis (size, shape) is verified when they differ
  function provClass(p) {
    const a = p.certainty_axes;
    if (!a) return p.certainty;
    if (a.size === a.shape) return a.size;
    return a.size === "verified" ? "size_verified" : a.shape === "verified" ? "shape_verified" : p.certainty;
  }
  // the colour code: the class, shaded by its evidence where it has one
  function provCode(p) {
    const k = provClass(p);
    return p.evidence && SHADES[k] ? CERT_CODE[k + "-" + p.evidence] : CERT_CODE[k];
  }

          const mo = holo.placeMotion(pl.id), cur = V.add([0, 1, 2].map((i) => mo.R[i][0] * pl.P3[0] + mo.R[i][1] * pl.P3[1] + mo.R[i][2] * pl.P3[2]), mo.t);

    });
    canvas.addEventListener("pointerup", () => { if (drag && drag.place) { checkHits(true); arrangeTell(); } drag = null; });
    canvas.addEventListener("pointerleave", () => { hover.style.display = "none"; });

    const grabKeys = () => { try { if (document.activeElement !== canvas) canvas.focus({ preventScroll: true }); } catch (err) { /* nothing to focus */ } };
    canvas.addEventListener("pointerenter", grabKeys);
    canvas.addEventListener("pointerdown", grabKeys);

    // flying: the arrow keys across the ground, Space up, Shift down (held); Alt goes faster. With a construct chosen
    // while arranging, the arrows move it instead
    const held = new Set();
    const flyKey = (e) => (e.key === " " ? " " : e.key === "Shift" ? "shift" : e.key.length === 1 ? e.key.toLowerCase() : e.key);
    const FLY = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "shift"]);
    let flyAt = 0;
    const fly = (t) => {
      if (!held.size || !holo.userCamera) { flyAt = 0; return; }
      const dt = flyAt ? Math.min(0.1, (t - flyAt) / 1000) : 0; flyAt = t;
      const c = holo.userCamera, y = c.yaw * Math.PI / 180;
      const fwd = [-Math.sin(y), 0, -Math.cos(y)], right = [Math.cos(y), 0, -Math.sin(y)];

      if (held.has(" ")) m[1] += 1; if (held.has("shift")) m[1] -= 1;

      const speed = Math.max(0.25, Math.min(25, c.dist * 0.32)) * (held.has("Alt") ? 3 : 1);

      if (e.key === "?") { toggleKeys(); return; }

      const chosen = arrangeOn() && holo.arr.sel;
      if (FLY.has(fk) && !(chosen && fk !== " ") && !drag) {
        if (!holo.userCamera) holo.userCamera = holo.cameraAt(now(), holo.cameraFor(opt.view));

        e.preventDefault(); kick(); return;
      }
      if (geo.world && (e.key === "a" || e.key === "A" || e.key === "g" || e.key === "G")) { setArrange(!arrangeOn()); return; }
      if (arrangeOn()) {
        const sel = holo.arr.sel;
        if (e.key === "Escape") { holo.arr.sel = null; holo.arr.multi.clear(); holo.arr.hits = []; arrangeTell(); kick(); return; }
        if (sel) {
          const k = holo.stepScale(sel), ed = editOf(sel), step = (e.shiftKey ? 1 : e.altKey ? 0.01 : 0.1) * k, c = holo.userCamera || holo.lastCamera;
          const yaw = (c ? c.yaw : 0) * Math.PI / 180;
          const fwd = [-Math.sin(yaw), 0, -Math.cos(yaw)], right = [Math.cos(yaw), 0, -Math.sin(yaw)];
          let w = null;

          else if (e.key === "ArrowRight") w = V.mul(right, step); else if (e.key === "ArrowLeft") w = V.mul(right, -step);
          const all = holo.arr.multi.size > 1 ? [...holo.arr.multi] : [sel];
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "q", "Q", "e", "E", "PageUp", "PageDown", "Backspace", "Delete"].includes(e.key)) remember();
          if (w) { for (const id of all) { const d = local(id, w), em = editOf(id); em.move = [em.move[0] + d[0], em.move[1], em.move[2] + d[2]]; } }
          else if (e.key === "q" || e.key === "Q") all.forEach((id) => { editOf(id).turn += e.shiftKey ? 1 : 15; });
          else if (e.key === "e" || e.key === "E") all.forEach((id) => { editOf(id).turn -= e.shiftKey ? 1 : 15; });
          else if (e.key === "PageUp") all.forEach((id) => { editOf(id).move[1] += (e.shiftKey ? 0.5 : 0.05) * k; });
          else if (e.key === "PageDown") all.forEach((id) => { editOf(id).move[1] -= (e.shiftKey ? 0.5 : 0.05) * k; });
          else if (e.key === "Backspace" || e.key === "Delete") all.forEach((id) => { delete holo.arr.edits[id]; });
          else w = false;
          if (w !== false) { e.preventDefault(); checkHits(true); lastInput = performance.now(); arrangeTell(); kick(); return; }
        }
      }
      const views = ["hero", "front", "side", "back", "top", "three-quarter"];
      if (e.key >= "1" && e.key <= "6") { opt.view = views[+e.key - 1]; holo.userCamera = null; }
      else if (e.key === "r" || e.key === "R") { clock0 = performance.now(); frozen = null; paused = false; holo.userCamera = null; }
      else if (e.key === "m" || e.key === "M") { opt.reduced = !opt.reduced; holo.opt.reduced = opt.reduced; holo.schedule = holo.buildSchedule(); }
      else if (e.key === "p" || e.key === "P") { opt.mode = opt.mode === "provenance" ? "light" : "provenance"; holo.opt.mode = opt.mode; setUi(); }

    });

    }

    window.addEventListener("resize", () => { resize(); kick(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });

    const artLoads = holo.art.map((a) => a.loading).filter(Boolean);
    const ready = Promise.all(artLoads).then(() => { frame(); kick(); document.body.setAttribute("data-ready", "1"); });
    window.HOLO = {
      ready, hologram: holo,
      renderAt(t, o) { o = o || {}; frozen = t; if (o.view) { opt.view = o.view; holo.userCamera = null; } if (o.mode) { opt.mode = o.mode; holo.opt.mode = o.mode; setUi(); }
        if (o.reduced !== undefined) { opt.reduced = o.reduced; holo.opt.reduced = o.reduced; holo.schedule = holo.buildSchedule(); }
        if (o.sheet !== undefined) opt.sheet = o.sheet;
        if (o.open !== undefined) { opt.open = o.open; holo.opt.open = o.open; }
        if (o.solid !== undefined) { opt.solid = !!o.solid; holo.opt.solid = opt.solid; setUi(); }
        if (o.text !== undefined) opt.text = !!o.text;
        ["build", "highlight", "fly", "reveal", "from"].forEach((k) => { if (o[k] !== undefined) holo.opt[k === "build" ? "buildTo" : k] = o[k]; });

      camera() { const c = holo.lastCamera; return c ? { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist, focus: c.focus, mode: opt.mode, solid: !!opt.solid } : null; },
      project(p) { const c = holo.lastVP && project(holo.lastVP, p); const r = canvas.getBoundingClientRect();

      fitted(view) { const c = holo.cameraFor(view || "hero"); return { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist }; },
      timeline() { const op = holo.openTimes(); return { assembly: holo.assemblyTimes(), open: op, settled: Math.max(holo.assemblyTimes().end, op.end), events: holo.schedule.slice(0, 24) }; },
      // the page's actions by name, so a host's buttons never depend on which key does what
      action(name) {

      },
      views() {

      view(id) { if (!(id === "hero" || ["front", "side", "back", "top", "three-quarter"].includes(id) || (geo.presentation.views || []).some((v) => v.id === id))) return false;

      // a world arranged by hand: on/off, the changes so far, put everything back; onArrange hears every change

        changes() { return holo.arrangeChanges(); },
        reset() { remember(); holo.arr.edits = {}; holo.arr.sel = null; holo.arr.multi.clear(); holo.arr.hits = []; arrangeTell(); kick(); return true; },

</script>
<script>
  // the improvement rounds, when a run recorded them (`construct rounds`): one line per round
  // (?rounds=1 shows them even without the UI; ?rounds=0 never shows them, as in a public gallery)
  (function () {
    var g = window.HOLOGRAM_GEOMETRY || {}, a = (g.provenance || {}).authoring || {}, rs = a.rounds || [];
    if (!rs.length || /[?&]rounds=0\b/.test(location.search)) return;
    var forced = /[?&]rounds=1\b/.test(location.search), box = document.createElement("div");
    var best = rs.filter(function (r) { return r.result !== "reverted"; }).slice(-1)[0];
    box.className = "rounds" + (forced ? " forced" : "");
    var head = document.createElement("div"); head.className = "head";
    head.textContent = "ROUNDS · " + rs.length + " · BEST R" + (best ? best.round : "-");
    box.appendChild(head);
    rs.forEach(function (r) {
      var row = document.createElement("div"); row.className = "r" + (best && r.round === best.round ? " best" : "");
      var n = document.createElement("span"); n.className = "n"; n.textContent = "R" + r.round;
      var res = document.createElement("span"); res.className = r.result; res.textContent = r.result;
      var m = document.createElement("span"); m.textContent = (r.minutes != null ? r.minutes.toFixed(0) + " min" : "");
      var c = document.createElement("span"); c.textContent = (r.changes || []).join(" ");
      var s = document.createElement("span"); s.textContent = r.summary || ""; row.title = r.summary || "";
      [n, res, m, c, s].forEach(function (e) { row.appendChild(e); });
      box.appendChild(row);
    });
    document.getElementById("stage").appendChild(box);
  })();
</script>
