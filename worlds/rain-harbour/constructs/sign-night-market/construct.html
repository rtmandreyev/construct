      if (geo.world && (e.key === "a" || e.key === "A" || e.key === "g" || e.key === "G")) { setArrange(!arrangeOn()); return; }
      if (arrangeOn()) {
        const sel = holo.arr.sel;
        if (e.key === "Escape") { holo.arr.sel = null; holo.arr.multi.clear(); holo.arr.hits = []; arrangeTell(); kick(); return; }
        if (sel) {
          const k = holo.stepScale(sel), ed = editOf(sel), step = (e.shiftKey ? 1 : e.altKey ? 0.01 : 0.1) * k, c = holo.userCamera || holo.lastCamera;
          const yaw = (c ? c.yaw : 0) * Math.PI / 180;
          const fwd = [-Math.sin(yaw), 0, -Math.cos(yaw)], right = [Math.cos(yaw), 0, -Math.sin(yaw)];
          let w = null;
          if (e.key === "ArrowUp") w = V.mul(fwd, step); else if (e.key === "ArrowDown") w = V.mul(fwd, -step);
          else if (e.key === "ArrowRight") w = V.mul(right, step); else if (e.key === "ArrowLeft") w = V.mul(right, -step);
          const all = holo.arr.multi.size > 1 ? [...holo.arr.multi] : [sel];
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "q", "Q", "e", "E", "PageUp", "PageDown", "Backspace", "Delete"].includes(e.key)) remember();
          if (w) { for (const id of all) { const d = local(id, w), em = editOf(id); em.move = [em.move[0] + d[0], em.move[1], em.move[2] + d[2]]; } }
          else if (e.key === "q" || e.key === "Q") all.forEach((id) => { editOf(id).turn += e.shiftKey ? 1 : 15; });
          else if (e.key === "e" || e.key === "E") all.forEach((id) => { editOf(id).turn -= e.shiftKey ? 1 : 15; });
          else if (e.key === "PageUp") all.forEach((id) => { editOf(id).move[1] += (e.shiftKey ? 0.5 : 0.05) * k; });
          else if (e.key === "PageDown") all.forEach((id) => { editOf(id).move[1] -= (e.shiftKey ? 0.5 : 0.05) * k; });
          else if (e.key === "Backspace" || e.key === "Delete") all.forEach((id) => { delete holo.arr.edits[id]; });
          else w = false;
          if (w !== false) { e.preventDefault(); checkHits(true); lastInput = performance.now(); arrangeTell(); kick(); return; }
        }
      }
      const views = ["hero", "front", "side", "back", "top", "three-quarter"];
      if (e.key >= "1" && e.key <= "6") { opt.view = views[+e.key - 1]; holo.userCamera = null; }
      else if (e.key === "r" || e.key === "R") { clock0 = performance.now(); frozen = null; paused = false; holo.userCamera = null; }
      else if (e.key === "m" || e.key === "M") { opt.reduced = !opt.reduced; holo.opt.reduced = opt.reduced; holo.schedule = holo.buildSchedule(); }
      else if (e.key === "p" || e.key === "P") { opt.mode = opt.mode === "provenance" ? "light" : "provenance"; holo.opt.mode = opt.mode; setUi(); }
      else if ((e.key === "s" || e.key === "S" || e.key === "o" || e.key === "O") && holo.solid) { opt.solid = !opt.solid; holo.opt.solid = opt.solid; setUi(); }
      else if (e.key === "f" || e.key === "F") skip();
      else if (e.key === "l" || e.key === "L") { opt.labels = !opt.labels; }
      else if (e.key === "t" || e.key === "T") { opt.text = !opt.text; }
      else if (e.key === ".") { if (paused) { clock0 += performance.now() - pausedStamp; paused = false; } else { pausedAt = now(); pausedStamp = performance.now(); paused = true; } e.preventDefault(); }
      else return;
      kick();
    });
    let pausedStamp = 0;
    const keysBox = el("div", "keys");
    [["Drag", "turn around"], ["Wheel", "closer, then on through"], ["Double-click", "look at that part"], ["Arrows", "fly across"],
     ["Space / Shift", "up / down (Alt: faster)"], ["F", "finish the assembly"], ["R", "replay"], ["1–6", "front, side, back, top…"],
     ["P", "how each part is known"], ["S", "solid"], ["L / T", "labels / printed text"], [".", "pause"]]
      .concat(geo.world ? [["A", "arrange: click one, drag it onto anything; Q/E or Shift-drag turn; PgUp/PgDn lift; ⌫ put back"]] : [])
      .forEach(([k, v]) => { const row = el("div", "row"); row.appendChild(el("b", "", k)); row.appendChild(el("span", "", v)); keysBox.appendChild(row); });
    overlay.appendChild(keysBox);
    function toggleKeys() { keysBox.classList.toggle("open"); }
    // F: the assembly done at once, everything in place and open to look at
    function skip() { const end = Math.max(holo.assemblyTimes().end, 0) + 0.05; frozen = null; paused = false; clock0 = performance.now() - end * 1000; kick(); }
    // a kiosk (?return=1): after a while untouched the presentation returns to its own camera
    if (opt.idleReturn) setInterval(() => { if (holo.userCamera && !arrangeOn() && performance.now() - lastInput > 25000) { holo.userCamera = null; kick(); } }, 2000);

    let raf = 0, lastFrame = 0, running = false;
    function loop(ts) {
      raf = 0;
      const interval = opt.fps > 0 ? 1000 / opt.fps : 0;
      fly(ts);
      if (ts - lastFrame >= interval - 1) { lastFrame = ts; frame(); }
      const still = (frozen !== null || paused || (opt.reduced && !holo.userCamera)) && !held.size;
      if (!still && !document.hidden) raf = requestAnimationFrame(loop); else running = false;
    }
    function kick() { if (!raf) { running = true; raf = requestAnimationFrame(loop); } }
    window.addEventListener("resize", () => { resize(); kick(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });

    const artLoads = holo.art.map((a) => a.loading).filter(Boolean);
    const ready = Promise.all(artLoads).then(() => { frame(); kick(); document.body.setAttribute("data-ready", "1"); });
    window.HOLO = {
      ready, hologram: holo,
      renderAt(t, o) { o = o || {}; frozen = t; if (o.view) { opt.view = o.view; holo.userCamera = null; } if (o.mode) { opt.mode = o.mode; holo.opt.mode = o.mode; setUi(); }
        if (o.reduced !== undefined) { opt.reduced = o.reduced; holo.opt.reduced = o.reduced; holo.schedule = holo.buildSchedule(); }
        if (o.sheet !== undefined) opt.sheet = o.sheet;
        if (o.open !== undefined) { opt.open = o.open; holo.opt.open = o.open; }
        if (o.solid !== undefined) { opt.solid = !!o.solid; holo.opt.solid = opt.solid; setUi(); }
        if (o.text !== undefined) opt.text = !!o.text;
        ["build", "highlight", "fly", "reveal", "from"].forEach((k) => { if (o[k] !== undefined) holo.opt[k === "build" ? "buildTo" : k] = o[k]; });
        frame(); return true; },
      camera() { const c = holo.lastCamera; return c ? { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist, focus: c.focus, mode: opt.mode, solid: !!opt.solid } : null; },
      project(p) { const c = holo.lastVP && project(holo.lastVP, p); const r = canvas.getBoundingClientRect();
        return c ? [(c[0] * 0.5 + 0.5) * r.width, (0.5 - c[1] * 0.5) * r.height] : null; },
      fitted(view) { const c = holo.cameraFor(view || "hero"); return { target: c.target, yaw: c.yaw, pitch: c.pitch, dist: c.dist }; },
      timeline() { const op = holo.openTimes(); return { assembly: holo.assemblyTimes(), open: op, settled: Math.max(holo.assemblyTimes().end, op.end), events: holo.schedule.slice(0, 24) }; },
      // the page's actions by name, so a host's buttons never depend on which key does what
      action(name) {
        if (name === "solid") { if (!holo.solid) return false; opt.solid = !opt.solid; holo.opt.solid = opt.solid; setUi(); }
        else if (name === "provenance") { opt.mode = opt.mode === "provenance" ? "light" : "provenance"; holo.opt.mode = opt.mode; setUi(); }
        else if (name === "replay") { clock0 = performance.now(); frozen = null; paused = false; }
        else if (name === "skip") skip();
        else if (name === "home") { opt.view = "hero"; holo.userCamera = null; }
        else if (name === "keys") toggleKeys();
        else return false;
        kick(); return true;
      },
      views() {
        const own = (geo.presentation.views || []).map((v) => ({ id: v.id, label: String(v.label || v.id) }));
        const builtin = [["hero", "Whole"], ["front", "Front"], ["side", "Side"], ["back", "Back"], ["top", "Top"]].map(([id, label]) => ({ id, label }));
        return geo.world ? [builtin[0]].concat(own) : builtin.concat(own.filter((v) => !builtin.some((b) => b.id === v.id)));
      },
      view(id) { if (!(id === "hero" || ["front", "side", "back", "top", "three-quarter"].includes(id) || (geo.presentation.views || []).some((v) => v.id === id))) return false;
        opt.view = id; holo.userCamera = null; kick(); return true; },
      // a world arranged by hand: on/off, the changes so far, put everything back; onArrange hears every change
      arrange: {
        set(on) { setArrange(on); return arrangeOn(); },
        changes() { return holo.arrangeChanges(); },
        reset() { remember(); holo.arr.edits = {}; holo.arr.sel = null; holo.arr.multi.clear(); holo.arr.hits = []; arrangeTell(); kick(); return true; },
        select(id) { if (!holo.arrangeable(id)) return false; holo.arr.sel = id; editOf(id); arrangeTell(); kick(); return true; },
        turn(deg) { const id = holo.arr.sel; if (!id || typeof deg !== "number") return false; remember();
          (holo.arr.multi.size > 1 ? [...holo.arr.multi] : [id]).forEach((x) => { editOf(x).turn += deg; }); checkHits(true); arrangeTell(); kick(); return true; },
        lift(m) { const id = holo.arr.sel; if (!id || typeof m !== "number") return false; remember();
          (holo.arr.multi.size > 1 ? [...holo.arr.multi] : [id]).forEach((x) => { editOf(x).move[1] += m; }); checkHits(true); arrangeTell(); kick(); return true; },
        putBack() { const id = holo.arr.sel; if (!id) return false; remember();
          (holo.arr.multi.size > 1 ? [...holo.arr.multi] : [id]).forEach((x) => { delete holo.arr.edits[x]; }); checkHits(true); arrangeTell(); kick(); return true; },
        liftStep(n) { const id = holo.arr.sel; if (!id || typeof n !== "number") return false; return this.lift(n * 0.25 * holo.stepScale(id)); },
        undo() { return stepBack(true); },
        redo() { return stepBack(false); },
        snap(on) { holo.arr.snap = on === undefined ? !holo.arr.snap : !!on; arrangeTell(); return holo.arr.snap; },
        edit(id, change) { if (!holo.arrangeable(id) || !change) return false; const ed = editOf(id);
          if (Array.isArray(change.move) && change.move.length === 3) ed.move = change.move.map(Number);
          if (typeof change.turn === "number") ed.turn = change.turn; arrangeTell(); kick(); return true; },
      },
      onArrange: null,
      // Finish (the card's): on/off, a colour tried on parts by their ids or patterns (in a world, of the placement
      // last clicked), and onFinish, told each part clicked
      finish: {
        set(on) { setFinish(on); return holo.fin.on; },
        on() { return holo.fin.on; },
        preview(patterns, colour, placement, material) {
          const done = this._preview(patterns, colour, placement, material);
          kick();   // the colour shows at once, not at the next move of the camera
          return done;
        },
        _preview(patterns, colour, placement, material) {
          if (!patterns && !material) return holo.previewColours(null);
          const res = (patterns || []).map(globRe), rgb = hex(colour);
          const where = placement === undefined || placement === null ? holo.fin.placement : placement;
          const mats = geo.part_materials || {};
          return holo.previewColours((pi) => { const p = geo.parts[pi];
            if (where && p.placement !== where) return false;
            if (material) { const m = mats[p.id]; return m === material || (p.placement && m === p.placement + ": " + material); }
            return res.some((re) => re.test(localId(p))); }, rgb);
        },
      },
      onFinish: null,
    };
    if (geo.world) { overlay.appendChild(arrangeBox); arrangeTell(); }
  }

  window.HologramViewer = { Hologram, boot, PALETTES };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
<script>
  // the improvement rounds, when a run recorded them (`construct rounds`): one line per round
  // (?rounds=1 shows them even without the UI; ?rounds=0 never shows them, as in a public gallery)
  (function () {
    var g = window.HOLOGRAM_GEOMETRY || {}, a = (g.provenance || {}).authoring || {}, rs = a.rounds || [];
    if (!rs.length || /[?&]rounds=0\b/.test(location.search)) return;
    var forced = /[?&]rounds=1\b/.test(location.search), box = document.createElement("div");
    var best = rs.filter(function (r) { return r.result !== "reverted"; }).slice(-1)[0];
    box.className = "rounds" + (forced ? " forced" : "");
    var head = document.createElement("div"); head.className = "head";
    head.textContent = "ROUNDS · " + rs.length + " · BEST R" + (best ? best.round : "-");
    box.appendChild(head);
    rs.forEach(function (r) {
      var row = document.createElement("div"); row.className = "r" + (best && r.round === best.round ? " best" : "");
      var n = document.createElement("span"); n.className = "n"; n.textContent = "R" + r.round;
      var res = document.createElement("span"); res.className = r.result; res.textContent = r.result;
      var m = document.createElement("span"); m.textContent = (r.minutes != null ? r.minutes.toFixed(0) + " min" : "");
      var c = document.createElement("span"); c.textContent = (r.changes || []).join(" ");
      var s = document.createElement("span"); s.textContent = r.summary || ""; row.title = r.summary || "";
      [n, res, m, c, s].forEach(function (e) { row.appendChild(e); });
      box.appendChild(row);
    });
    document.getElementById("stage").appendChild(box);
  })();
</script>
