name: construct
version: "0.1.0"
description: Build constructs (animated holograms of real or invented things, built from facts, every part saying how it is known), see them live in the chat, and export them as glTF, 3D prints, CAD and films.
author: Artyom Andreyev
manifest_version: 2
license: Apache-2.0
homepage: https://github.com/rtmandreyev/construct
requires_hermes: ">=0.22"
provides_tools: [construct_start, construct_check, construct_inspect, construct_build, construct_review, construct_export, construct_film, construct_job, construct_command]
provides_hooks: [pre_tool_call]
tags: [creative, 3d, hologram, webgl, gltf, 3d-printing, cad, provenance]
config_schema:
  projects_folder:
    type: str
    default: ""
    label: Projects folder
    description: Where construct projects (scenes, builds, reviews, exports, films) are kept. Blank keeps them in the plugin's own data folder.
  confirm_runs:
    type: bool
    default: false
    label: Ask before running programs
    description: Ask before Construct runs a headless browser, ffmpeg, FreeCAD or Blender on this machine. Scheduled runs are refused while this is on.
