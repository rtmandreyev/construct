<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #050205; color: #a597b3;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .14em; }
  #wait { display: flex; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
</style>
</head>
<body>
<div id="wait">OPENING THE CONSTRUCT</div>
<script>
/* The construct's page is too large to put in a frame's address (several megabytes of geometry), so this
   small page stands in for it. Opened from disk, it goes to the page beside it. Shown by the Construct
   plugin in Hermes Desktop, it asks the host for the page, checks what arrives and replaces itself with it,
   adding a small relay that turns the host's toolbar buttons into the viewer's own keys. */
(function () {
  "use strict";
  var MAX = 64 * 1024 * 1024;
  var PAGE = "construct.html";
  var wait = document.getElementById("wait");
  if (location.protocol === "file:") { location.replace(PAGE); return; }
  if (window.parent === window) { wait.textContent = "OPEN " + PAGE + " BESIDE THIS FILE"; return; }

  // Runs inside the construct's page once it has replaced this one. Only keys the viewer knows pass.
  var RELAY = "<script>(" + String(function () {
    var KEYS = { p: 1, s: 1, r: 1, m: 1, l: 1, t: 1, " ": 1, "1": 1, "2": 1, "3": 1, "4": 1, "5": 1, "6": 1 };
    function state() {
      var h = window.HOLO && window.HOLO.hologram;
      var o = (h && h.opt) || {};
      return { type: "construct:state", ready: !!h, mode: o.mode === "provenance" ? "provenance" : "light",
               solid: !!o.solid, hasSolid: !!(h && h.solid), reduced: !!o.reduced };
    }
    function tell() { try { parent.postMessage(state(), "*"); } catch (e) { /* the host went away */ } }
    window.addEventListener("message", function (e) {
      if (e.source !== parent) return;
      var d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "construct:key" && typeof d.key === "string" && d.key.length === 1 && KEYS[d.key]) {
        window.dispatchEvent(new KeyboardEvent("keydown", { key: d.key, bubbles: true }));
        tell();
      } else if (d.type === "construct:ask") {
        tell();
      }
    });
    // the viewer starts on DOMContentLoaded (its listener came first); report once it is ready
    function hook() { if (window.HOLO && window.HOLO.ready) window.HOLO.ready.then(tell, tell); else tell(); }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(hook, 0); });
    else setTimeout(hook, 0);
  }) + ")();<\/script>";

  var done = false;
  window.addEventListener("message", function (e) {
    if (done || e.source !== parent) return;
    var d = e.data;
    if (!d || typeof d !== "object" || d.type !== "construct:page") return;
    var html = d.html;
    if (typeof html !== "string" || html.length < 64 || html.length > MAX) return;
    if (!/^\s*<!doctype html>/i.test(html.slice(0, 64)) || html.indexOf('id="hologram-geometry"') < 0) return;
    done = true;
    var end = html.lastIndexOf("</body>");
    // in the chat the card's own toolbar names the keys, so the page's help line and round history step aside
    var add = "<style>.help,.rounds{display:none!important}</style>" + RELAY;
    html = end < 0 ? html + add : html.slice(0, end) + add + html.slice(end);
    document.open();
    document.write(html);
    document.close();
  });
  window.addEventListener("message", function (e) {
    if (!done && e.source === parent && e.data && e.data.type === "construct:failed" && typeof e.data.reason === "string") {
      wait.textContent = e.data.reason.slice(0, 200).toUpperCase();
    }
  });
  try { parent.postMessage({ type: "construct:loader-ready" }, "*"); } catch (e) { /* no host */ }
})();
</script>
</body>
</html>
