[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construct-hologram"   # the distribution: keep in step with construct_hologram/product.py (DIST)
version = "0.2.1"
description = "Construct: holographic constructs any agent can build — from a description, honestly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["construct", "hologram", "holographic", "3d", "webgl", "agent-skill", "mcp", "visualization"]

[project.scripts]
construct = "construct_hologram.__main__:main"
construct-mcp = "construct_hologram.mcp_server:main"

[tool.setuptools.packages.find]
include = ["construct_hologram*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.js", "*.png", "prompts/*", "examples/**/*", "skill/**/*", "viewer/*",
       "evaluation/*"]
